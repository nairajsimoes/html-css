<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php">
        <fieldset>
            <legend>Você gosta de Kpop?</legend>
            <input type="radio" name="Kpop" id="isim"> <label for="isim">Sim</label> <br>
            <input type="radio" name="Kpop" id="inao"> <label for="inao">Não</label>
        </fieldset>
        <fieldset>
            <legend>Grupos de Kpop favoritos</legend>
            <input type="checkbox" name="bts" id="ibts"> 
            <label for="ibts">BTS</label> <br>
            <input type="checkbox" name="txt" id="itxt">
            <label for="itxt">TXT</label> <br>
            <input type="checkbox" name="blackpink" id="iblackpink">
            <label for="iblackpink">BLACKPINK</label> <br>
            <input type="checkbox" name="twice" id="itwice">
            <label for="itwice">TWICE</label> <br>
            <input type="checkbox" name="shinee" id="ishinee">
            <label for="ishinee">SHINEE</label>

        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p> 
    </form>
</body>
</html>
